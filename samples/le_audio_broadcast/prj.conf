# Role-specific Bluetooth options are defaulted in Kconfig from
# CONFIG_BROADCAST_ROLE_SOURCE / CONFIG_BROADCAST_ROLE_SINK.
CONFIG_INPUT=y
CONFIG_LOG=y
CONFIG_TROPOSOUND_HEADSET=y
CONFIG_MAIN_STACK_SIZE=4096

CONFIG_BT=y
CONFIG_BT_AUDIO=y
CONFIG_BT_EXT_ADV=y
CONFIG_UTF8=y

# One mono BIS
CONFIG_BT_ISO_MAX_CHAN=1
CONFIG_BT_ISO_TX_BUF_COUNT=4
CONFIG_BT_ISO_TX_MTU=120
CONFIG_BT_ISO_RX_BUF_COUNT=6
CONFIG_BT_ISO_RX_MTU=160

# Phones put long metadata into the BASE
CONFIG_BT_AUDIO_CODEC_CFG_MAX_METADATA_SIZE=64
CONFIG_BT_AUDIO_CODEC_CFG_MAX_DATA_SIZE=64
CONFIG_BT_AUDIO_CODEC_CAP_MAX_METADATA_SIZE=64
CONFIG_BT_AUDIO_CODEC_CAP_MAX_DATA_SIZE=64

CONFIG_BT_DEVICE_NAME="Troposound Broadcast"

CONFIG_LIBLC3=y
CONFIG_FPU=y
