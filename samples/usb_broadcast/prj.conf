CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=4096

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_AUDIO2_CLASS=y
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
# Serial number descriptor comes from the FICR device ID.
CONFIG_HWINFO=y

CONFIG_BT=y
CONFIG_BT_AUDIO=y
CONFIG_BT_EXT_ADV=y
CONFIG_BT_ISO_BROADCASTER=y
CONFIG_BT_BAP_BROADCAST_SOURCE=y
CONFIG_BT_BAP_BROADCAST_SRC_STREAM_COUNT=2
CONFIG_BT_BAP_BROADCAST_SRC_SUBGROUP_COUNT=1
CONFIG_BT_PBP=y
CONFIG_BT_DEVICE_NAME="Troposound USB Broadcast"
CONFIG_UTF8=y

# Two BISes, left and right
CONFIG_BT_ISO_MAX_CHAN=2
CONFIG_BT_ISO_TX_BUF_COUNT=6
CONFIG_BT_ISO_TX_MTU=120

CONFIG_LIBLC3=y
CONFIG_FPU=y

CONFIG_TROPOSOUND_VOLUME=y
