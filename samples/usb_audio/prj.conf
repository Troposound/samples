CONFIG_LOG=y

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_AUDIO2_CLASS=y
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
# Serial number descriptor comes from the FICR device ID.
CONFIG_HWINFO=y

# TAC5211 codec over I2C
CONFIG_AUDIO=y
CONFIG_AUDIO_CODEC=y

# nrfx I2S0 master, 1 ms blocks to match the USB frame
CONFIG_TROPOSOUND_AUDIO_I2S=y
CONFIG_TROPOSOUND_AUDIO_I2S_BLOCK_WORDS=48
CONFIG_TROPOSOUND_HEADSET=y
CONFIG_TROPOSOUND_VOLUME=y
