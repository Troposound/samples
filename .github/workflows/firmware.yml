name: Firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    container: ghcr.io/nrfconnect/sdk-nrf-toolchain:v3.4.2
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: samples

      - uses: actions/cache@v4
        with:
          path: |
            .west
            bootloader
            modules
            nrf
            nrfxlib
            test
            tools
            zephyr
          key: west-${{ hashFiles('samples/west.yml') }}

      - name: Initialize workspace
        run: |
          git config --global --add safe.directory '*'
          [ -d .west ] || west init -l samples
          west update --narrow -o=--depth=1

      - name: Build
        run: samples/bin/build.sh

      - name: Package
        run: |
          mkdir dist
          for hex in samples/bin/*/*.hex; do
            cp "$hex" "dist/$(basename "$(dirname "$hex")")_$(basename "$hex")"
          done
          cp samples/bin/flash.sh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: dist/

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
